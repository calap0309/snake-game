<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root { --bg:#0f1115; --grid:#1a1d24; --snake:#4ade80; --head:#22c55e; --food:#f87171; --text:#e5e7eb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:16px; user-select:none; -webkit-user-select:none;
  }
  h1 { font-size:18px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; margin:0; opacity:.85; }
  .hud { display:flex; gap:24px; font-size:14px; opacity:.9; }
  .hud b { color: var(--snake); }
  .wrap { position:relative; }
  canvas { background: var(--grid); border-radius:12px; display:block; touch-action:none; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; text-align:center;
    background: rgba(10,12,16,.82); border-radius:12px; backdrop-filter: blur(3px);
  }
  .overlay.hidden { display:none; }
  .overlay h2 { margin:0; font-size:22px; }
  .overlay p { margin:0; font-size:13px; opacity:.8; line-height:1.6; }
  button {
    margin-top:6px; padding:10px 22px; font:inherit; font-size:14px; cursor:pointer;
    background: var(--snake); color:#06210f; border:none; border-radius:8px; font-weight:700;
  }
  button:active { transform: translateY(1px); }
  .hint { font-size:12px; opacity:.45; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div class="hud">
    <span>Score <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
  </div>
  <div class="wrap">
    <canvas id="c" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Snake</h2>
      <p id="msg">Arrow keys / WASD to move<br>Swipe on touch</p>
      <button id="btn">Play</button>
    </div>
  </div>
  <div class="hint">P / Space — pause &nbsp;•&nbsp; R — restart</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const COLS = 21, ROWS = 21;
  const CELL = canvas.width / COLS;

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl   = document.getElementById('msg');
  const btn     = document.getElementById('btn');

  let snake, dir, nextDir, food, score, best, state, tickMs, acc, last, speedUpAt;

  best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir;
    score = 0; scoreEl.textContent = 0;
    tickMs = 130; acc = 0; last = performance.now(); speedUpAt = 0;
    placeFood();
    state = 'ready';
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x+','+s.y));
    const free = [];
    for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++)
      if (!occupied.has(x+','+y)) free.push({x,y});
    food = free[Math.floor(Math.random()*free.length)] || {x:0,y:0};
  }

  function start() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snakeBest', best); }
    titleEl.textContent = 'Game Over';
    msgEl.innerHTML = `You scored <b style="color:var(--snake)">${score}</b><br>Best: ${best}`;
    btn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return gameOver();
    // tail moves away, so hitting it is only fatal if not this exact step's tail (classic lenient rule)
    for (let i=0;i<snake.length-1;i++)
      if (snake[i].x===head.x && snake[i].y===head.y) return gameOver();

    snake.unshift(head);
    if (head.x===food.x && head.y===food.y) {
      score += 1; scoreEl.textContent = score;
      placeFood();
      if (score % 5 === 0 && tickMs > 60) tickMs -= 8; // speed up
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // grid dots
    ctx.fillStyle = '#232733';
    for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
      ctx.fillRect(x*CELL + CELL/2 - 1, y*CELL + CELL/2 - 1, 2, 2);
    }

    // food (pulsing)
    const t = performance.now()/300;
    const r = CELL*0.32 + Math.sin(t)*CELL*0.05;
    ctx.fillStyle = 'var(--food)';
    ctx.beginPath();
    ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, r, 0, Math.PI*2);
    ctx.fill();

    // snake
    snake.forEach((s,i) => {
      const pad = 1.5;
      ctx.fillStyle = i===0 ? 'var(--head)' : 'var(--snake)';
      ctx.globalAlpha = i===0 ? 1 : Math.max(0.45, 1 - i/(snake.length*1.4));
      roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-2*pad, CELL-2*pad, 5);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function roundRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(now) {
    if (state !== 'playing') return;
    const dt = now - last; last = now; acc += dt;
    while (acc >= tickMs) { acc -= tickMs; step(); if (state!=='playing') break; }
    draw();
    requestAnimationFrame(loop);
  }

  // input
  const DIRS = {
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
    W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0},
  };
  function setDir(d) {
    if (!d) return;
    if (state==='ready' || state==='over') { start(); }
    if (d.x === -dir.x && d.y === -dir.y) return; // no 180° reversal
    nextDir = d;
  }

  window.addEventListener('keydown', e => {
    if (e.key==='p' || e.key==='P' || e.key===' ') {
      e.preventDefault();
      if (state==='playing') { state='paused'; titleEl.textContent='Paused'; msgEl.textContent='Press P to resume'; btn.textContent='Resume'; overlay.classList.remove('hidden'); }
      else if (state==='paused') { state='playing'; overlay.classList.add('hidden'); last=performance.now(); requestAnimationFrame(loop); }
      return;
    }
    if (e.key==='r' || e.key==='R') { start(); return; }
    if (DIRS[e.key]) { e.preventDefault(); setDir(DIRS[e.key]); }
  });

  btn.addEventListener('click', () => {
    if (state==='paused') { state='playing'; overlay.classList.add('hidden'); last=performance.now(); requestAnimationFrame(loop); }
    else start();
  });

  // touch swipe
  let tsx=0, tsy=0;
  canvas.addEventListener('touchstart', e => { const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  canvas.addEventListener('touchend', e => {
    const t=e.changedTouches[0]; const dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx)<20 && Math.abs(dy)<20) { if(state!=='playing') start(); return; }
    setDir(Math.abs(dx)>Math.abs(dy) ? {x:Math.sign(dx),y:0} : {x:0,y:Math.sign(dy)});
  }, {passive:true});

  reset();
  draw();
})();
</script>
</body>
</html>
